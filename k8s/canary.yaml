---
# Canary Deployment for Production
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agro-api-canary
  namespace: agro-smart
  labels:
    app: agro-api
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agro-api
      version: canary
  template:
    metadata:
      labels:
        app: agro-api
        version: canary
    spec:
      containers:
      - name: app
        image: ${DOCKER_REGISTRY}/agro-smart:canary
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
        - name: metrics
          containerPort: 8001
        envFrom:
        - configMapRef:
            name: agro-api-config
        - secretRef:
            name: agro-api-secrets
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
---
# Canary Service (routes 10% of traffic)
apiVersion: v1
kind: Service
metadata:
  name: agro-api-canary-service
  namespace: agro-smart
spec:
  type: ClusterIP
  selector:
    app: agro-api
    version: canary
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: metrics
    port: 8001
    targetPort: metrics
---
# VirtualService for Canary (Istio)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: agro-api-canary
  namespace: agro-smart
spec:
  hosts:
  - agro-api-service
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: agro-api-service
        port:
          number: 80
      weight: 90
    - destination:
        host: agro-api-canary-service
        port:
          number: 80
      weight: 10
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
