# ==========================================
# Docker Compose pour AgroSmart Production
# ==========================================

version: '3.8'

services:
  # Application principale
  agrosmart:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: agrosmart_app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://agro:agropass@postgres:5432/agro_smart
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - MARKET_API_KEY=${MARKET_API_KEY}
      - SATELLITE_API_KEY=${SATELLITE_API_KEY:-DEMO_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - RATE_LIMIT_REQUESTS=120
      - RATE_LIMIT_WINDOW=60
      - LOG_LEVEL=info
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - agrosmart_data:/app/data
      - agrosmart_logs:/app/logs
      - prometheus_data:/tmp/prometheus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Base de données PostgreSQL (optionnel - commenté par défaut)
  postgres:
    image: postgres:15-alpine
    container_name: agrosmart_db
    environment:
      - POSTGRES_DB=agro_smart
      - POSTGRES_USER=agro
      - POSTGRES_PASSWORD=agropass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agro_smart"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy (optionnel - pour production)
  nginx:
    image: nginx:alpine
    container_name: agrosmart_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - agrosmart
    restart: unless-stopped
    profiles:
      - production

  # Redis pour cache (optionnel - pour performance)
  redis:
    image: redis:7-alpine
    container_name: agrosmart_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles:
      - cache

volumes:
  agrosmart_data:
    driver: local
  agrosmart_logs:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  default:
    name: agrosmart_network