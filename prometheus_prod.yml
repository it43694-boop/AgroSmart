global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

rule_files:
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  - job_name: 'agro-api-prod'
    static_configs:
      - targets: ['app:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'postgres-prod'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis-prod'
    static_configs:
      - targets: ['redis:6379']
