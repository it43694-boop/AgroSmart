version: '3.8'

services:
  agrosmart:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: agrosmart_app_staging
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=staging
      - DATABASE_URL=postgresql://agro:agropass@postgres:5432/agro_smart
      - SECRET_KEY=${SECRET_KEY:-change-this-in-staging}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - MARKET_API_KEY=${MARKET_API_KEY}
      - SATELLITE_API_KEY=${SATELLITE_API_KEY:-DEMO_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - RATE_LIMIT_REQUESTS=200
      - RATE_LIMIT_WINDOW=60
      - LOG_LEVEL=debug
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    volumes:
      - agrosmart_data_staging:/app/data
      - agrosmart_logs_staging:/app/logs
      - prometheus_data_staging:/tmp/prometheus
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: agrosmart_db_staging
    environment:
      - POSTGRES_DB=agro_smart
      - POSTGRES_USER=agro
      - POSTGRES_PASSWORD=agropass
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agro_smart"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agrosmart_data_staging:
    driver: local
  agrosmart_logs_staging:
    driver: local
  postgres_data_staging:
    driver: local
  prometheus_data_staging:
    driver: local

networks:
  default:
    name: agrosmart_network_staging
